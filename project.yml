name: AirCard-iOS
options:
  bundleIdPrefix: com.wallet
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.2"
    CURRENT_PROJECT_VERSION: "1.3.2"
    TARGETED_DEVICE_FAMILY: "1"
    # AirliftFFI is arm64-only (aws-lc-rs / idevice); drop x86_64 simulator slice.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  AirCard-iOS:
    type: application
    platform: iOS
    sources:
      - path: ios-app
    dependencies:
      - target: LoopbackVPN
        embed: true
      - sdk: NetworkExtension.framework
      - framework: AirliftFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: "AirCard-iOS"
        PRODUCT_BUNDLE_IDENTIFIER: com.wallet.aircard
        CODE_SIGN_ENTITLEMENTS: ios-app/AirCard.entitlements
        INFOPLIST_FILE: ios-app/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # idevice's static lib pulls in C++ symbols (aws-lc); link libc++.
        OTHER_LDFLAGS: "-lc++"
        GENERATE_INFOPLIST_FILE: NO
  LoopbackVPN:
    type: app-extension
    platform: iOS
    sources:
      - path: loopback-vpn
    dependencies:
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wallet.aircard.LoopbackVPN
        PRODUCT_NAME: LoopbackVPN
        INFOPLIST_FILE: loopback-vpn/Info.plist
        CODE_SIGN_ENTITLEMENTS: loopback-vpn/LoopbackVPN.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
  AirCard-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests
        excludes:
          - loopback-packet
          - card-face-model
    dependencies:
      - target: AirCard-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wallet.aircard.tests

schemes:
  AirCard-iOS:
    build:
      targets:
        AirCard-iOS: all
    test:
      targets:
        - AirCard-iOSTests
